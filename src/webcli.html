<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netmark web CLI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101418; color: #d7e0e8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 0.6rem 1rem; background: #161c23; border-bottom: 1px solid #2a333d; font-weight: bold; }
  header span { color: #6aa84f; }
  #terminal { padding: 1rem; height: calc(100vh - 15rem); overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  #status { padding: 0.6rem 1rem; background: #131920; border-bottom: 1px solid #2a333d; display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.3rem 1rem; }
  #status div { display: flex; gap: 0.4rem; }
  #status .label { color: #8fa3b5; }
  #status .value { color: #d7e0e8; }
  #status.running .value#activity { color: #6aa84f; }
  #status.stale .value { color: #e06c75; }
  #light { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #4b5866; align-self: center; }
  #status.running #light { background: #6aa84f; }
  #status.stale #light { background: #e06c75; }
  .cmd { color: #6aa84f; }
  .err { color: #e06c75; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; background: #161c23; border-top: 1px solid #2a333d; }
  #prompt { color: #6aa84f; align-self: center; }
  input { flex: 1; background: #101418; color: #d7e0e8; border: 1px solid #2a333d; border-radius: 4px; padding: 0.5rem; font: inherit; }
  input:focus { outline: 1px solid #6aa84f; }
</style>
</head>
<body>
<header>netmark <span>web CLI</span> &mdash; the same commands as the shell CLI; type <span>help</span>, or <span>help start</span> for one command</header>
<section id="status" aria-live="polite">
  <div><span id="light" title="traffic activity"></span><span class="label">status</span><span class="value" id="activity">connecting&hellip;</span></div>
  <div><span class="label">transport</span><span class="value" id="transport">-</span></div>
  <div><span class="label">sctp</span><span class="value" id="sctp">-</span></div>
  <div><span class="label">run</span><span class="value" id="run">-</span></div>
  <div><span class="label">sent</span><span class="value" id="sent">-</span></div>
  <div><span class="label">received</span><span class="value" id="received">-</span></div>
  <div><span class="label">bandwidth</span><span class="value" id="bandwidth">-</span></div>
  <div><span class="label">server</span><span class="value" id="server">-</span></div>
  <div><span class="label">clients</span><span class="value" id="clients">-</span></div>
  <div><span class="label">web server</span><span class="value" id="web">-</span></div>
</section>
<div id="terminal"></div>
<form id="form">
  <span id="prompt">netmark&gt;</span>
  <input id="input" autocomplete="off" autofocus spellcheck="false" placeholder="help">
</form>
<script>
  const terminal = document.getElementById('terminal');
  const input = document.getElementById('input');
  const history = [];
  let historyIndex = 0;

  function print(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
  }

  let promptText = 'netmark>';

  async function run(command) {
    print(promptText + ' ' + command, 'cmd');
    try {
      const response = await fetch('/api/v1/cli', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command })
      });
      const body = await response.json();
      if (body.output !== undefined) print(body.output);
      else print(body.error || ('HTTP ' + response.status), 'err');
    } catch (error) {
      print(String(error), 'err');
    }
  }

  document.getElementById('form').addEventListener('submit', event => {
    event.preventDefault();
    const command = input.value.trim();
    input.value = '';
    if (!command) return;
    history.push(command);
    historyIndex = history.length;
    run(command);
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp' && historyIndex > 0) {
      historyIndex -= 1;
      input.value = history[historyIndex];
      event.preventDefault();
    } else if (event.key === 'ArrowDown') {
      historyIndex = Math.min(historyIndex + 1, history.length);
      input.value = history[historyIndex] || '';
      event.preventDefault();
    }
  });

  run('help');

  // The status section polls the service so it follows a run live, without the
  // page ever being reloaded.
  const status = document.getElementById('status');
  const set = (id, text) => { document.getElementById(id).textContent = text; };

  async function refreshStatus() {
    try {
      const response = await fetch('/api/v1/status');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const body = await response.json();
      status.classList.remove('stale');
      status.classList.toggle('running', body.running === true);
      set('activity', body.activity || (body.running ? 'running' : 'idle'));
      set('transport', body.packet_type || '-');
      set('sctp', body.sctp || '-');
      set('run', body.run_id ? body.run_id + ' (' + body.elapsed_seconds + ' s)' : 'none yet');
      set('sent', body.sent_bytes + ' bytes');
      set('received', body.received_bytes + ' bytes');
      set('bandwidth', body.sent_bytes_per_second + ' up / ' + body.received_bytes_per_second + ' down bytes/sec');
      set('server', body.server_enabled ? 'enabled' : 'disabled');
      set('clients', body.clients_enabled + ' enabled');
      set('web', body.web_address || body.web_server || '-');
      promptText = shellPrompt(body);
      document.getElementById('prompt').textContent = promptText;
    } catch (error) {
      status.classList.add('stale');
      set('activity', 'status unavailable: ' + error);
    }
  }

  // The prompt mirrors the shell CLI, which names the roles that are on and
  // whether a run is going.
  function shellPrompt(body) {
    const parts = [];
    if (body.clients_enabled > 0) parts.push(body.running ? 'Client Running' : 'Client');
    if (body.server_enabled) parts.push(body.running ? 'Server Running' : 'Server');
    return (parts.join(' | ') + ' >').trim();
  }

  refreshStatus();
  setInterval(refreshStatus, 1000);
</script>
</body>
</html>
