kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  # Dedicated node for PostgreSQL/Timescale, its data volume, and the netmark
  # application pod that shares it (so log/netmark.sqlite lives with postgres).
  - role: worker
    labels:
      netmark.io/role: database
  # Dedicated node for Grafana, which graphs the external metrics database.
  - role: worker
    labels:
      netmark.io/role: app
    extraPortMappings:
      # The netmark web interface / REST API NodePort, reachable from the host.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Grafana graphs of the external metrics database.
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
