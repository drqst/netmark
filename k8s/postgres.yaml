# The netmark cluster keeps three containers: this file holds the PostgreSQL
# container and the volume container that owns the data volume, and
# netmark.yaml holds the web server container.
apiVersion: v1
kind: Namespace
metadata:
  name: netmark
---
apiVersion: v1
kind: Secret
metadata:
  name: netmark-postgres
  namespace: netmark
type: Opaque
stringData:
  POSTGRES_USER: netmark
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: netmark
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netmark-postgres-data
  namespace: netmark
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmark-postgres
  namespace: netmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netmark-postgres
  template:
    metadata:
      labels:
        app: netmark-postgres
    spec:
      affinity:
        nodeAffinity:
          # Prefer the dedicated database node from kind-config.yaml, but still
          # schedule on single-node clusters such as Docker Desktop.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: netmark.io/role
                    operator: In
                    values: [database]
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: netmark-postgres
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        # The volume container: it owns the persistent volume, prepares it for
        # PostgreSQL before the database writes to it and then reports how full
        # it is, so storage is inspectable without entering the database.
        - name: volume
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              test -w /data || echo "warning: the data volume is not writable";
              while true; do
              echo "netmark data volume: $(df -h /data | tail -n 1)";
              sleep 300;
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netmark-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: netmark-postgres
  namespace: netmark
spec:
  type: ClusterIP
  selector:
    app: netmark-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
