# Grafana graphs the external CLI metrics database (PostgreSQL/Timescale).
# Every netmark_metrics row carries run_id; the provisioned dashboard filters and
# groups on it so each run is a separate series.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netmark-grafana-provisioning
  namespace: netmark
data:
  datasource.yaml.template: |
    apiVersion: 1
    datasources:
      - name: Netmark Metrics
        uid: netmark-metrics
        type: postgres
        access: proxy
        url: netmark-postgres:5432
        user: __POSTGRES_USER__
        secureJsonData:
          password: __POSTGRES_PASSWORD__
        jsonData:
          database: __POSTGRES_DB__
          sslmode: disable
          postgresVersion: 1600
          timescaledb: true
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: netmark
        orgId: 1
        folder: Netmark
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    sed \
      -e "s|__POSTGRES_USER__|${POSTGRES_USER}|g" \
      -e "s|__POSTGRES_PASSWORD__|${POSTGRES_PASSWORD}|g" \
      -e "s|__POSTGRES_DB__|${POSTGRES_DB}|g" \
      /etc/grafana/netmark-provisioning/datasource.yaml.template \
      > /etc/grafana/provisioning/datasources/datasource.yaml
    cp /etc/grafana/netmark-provisioning/dashboards.yaml \
      /etc/grafana/provisioning/dashboards/dashboards.yaml
    exec /run.sh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netmark-grafana-dashboards
  namespace: netmark
data:
  netmark-metrics.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "postgres", "uid": "netmark-metrics" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "spanNulls": true },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "netmark-metrics" },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT $__timeGroupAlias(timestamp_utc::timestamptz, $__interval), run_id::text AS metric, AVG(sent_bytes_per_second) AS value FROM netmark_metrics WHERE $__timeFilter(timestamp_utc::timestamptz) AND ($run_id = 0 OR run_id = $run_id) GROUP BY 1, 2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Upload bandwidth by run_id",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "postgres", "uid": "netmark-metrics" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "spanNulls": true },
              "unit": "Bps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "netmark-metrics" },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT $__timeGroupAlias(timestamp_utc::timestamptz, $__interval), run_id::text AS metric, AVG(received_bytes_per_second) AS value FROM netmark_metrics WHERE $__timeFilter(timestamp_utc::timestamptz) AND ($run_id = 0 OR run_id = $run_id) GROUP BY 1, 2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Download bandwidth by run_id",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "postgres", "uid": "netmark-metrics" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "spanNulls": true },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "netmark-metrics" },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT $__timeGroupAlias(timestamp_utc::timestamptz, $__interval), run_id::text AS metric, AVG(jitter_millis) AS value FROM netmark_metrics WHERE $__timeFilter(timestamp_utc::timestamptz) AND ($run_id = 0 OR run_id = $run_id) GROUP BY 1, 2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Jitter by run_id",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "postgres", "uid": "netmark-metrics" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "spanNulls": true },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "netmark-metrics" },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT $__timeGroupAlias(timestamp_utc::timestamptz, $__interval), run_id::text AS metric, AVG(lost_udp_packets) AS value FROM netmark_metrics WHERE $__timeFilter(timestamp_utc::timestamptz) AND ($run_id = 0 OR run_id = $run_id) GROUP BY 1, 2 ORDER BY 1",
              "refId": "A"
            }
          ],
          "title": "Lost UDP packets by run_id",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "postgres", "uid": "netmark-metrics" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 5,
          "targets": [
            {
              "datasource": { "type": "postgres", "uid": "netmark-metrics" },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT timestamp_utc, run_id, sent_tcp_bytes, received_tcp_bytes, sent_udp_bytes, received_udp_bytes, sent_ip_bytes, received_ip_bytes, sent_bytes_per_second, received_bytes_per_second, lost_udp_packets, out_of_order_udp_packets, jitter_millis FROM netmark_metrics WHERE $__timeFilter(timestamp_utc::timestamptz) AND ($run_id = 0 OR run_id = $run_id) ORDER BY timestamp_utc DESC LIMIT 200",
              "refId": "A"
            }
          ],
          "title": "Metrics rows (run_id on every entry)",
          "type": "table"
        }
      ],
      "schemaVersion": 39,
      "tags": ["netmark", "metrics"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": "All runs", "value": "0" },
            "datasource": { "type": "postgres", "uid": "netmark-metrics" },
            "definition": "SELECT 0 AS __value, 'All runs' AS __text UNION ALL SELECT DISTINCT run_id AS __value, 'run ' || run_id::text AS __text FROM netmark_metrics ORDER BY 1",
            "name": "run_id",
            "label": "Run ID",
            "query": "SELECT 0 AS __value, 'All runs' AS __text UNION ALL SELECT DISTINCT run_id AS __value, 'run ' || run_id::text AS __text FROM netmark_metrics ORDER BY 1",
            "refresh": 2,
            "type": "query",
            "includeAll": false
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "utc",
      "title": "Netmark external metrics",
      "uid": "netmark-metrics-dash",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmark-grafana
  namespace: netmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netmark-grafana
  template:
    metadata:
      labels:
        app: netmark-grafana
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: netmark.io/role
                    operator: In
                    values: [app]
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/grafana/netmark-provisioning/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmark-postgres
                  key: POSTGRES_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/netmark-metrics.json
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: netmark-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmark-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: netmark-postgres
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/netmark-provisioning
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: provisioning
          configMap:
            name: netmark-grafana-provisioning
            defaultMode: 0755
        - name: datasources
          emptyDir: {}
        - name: dashboard-provider
          emptyDir: {}
        - name: dashboards
          configMap:
            name: netmark-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: netmark-grafana
  namespace: netmark
spec:
  type: NodePort
  selector:
    app: netmark-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
